yaml
name: ASX Strong Buy Screener

on:
  schedule:
    # 20:30 UTC on Sun-Thu = 06:30 AEST (Brisbane, UTC+10, no daylight saving) Mon-Fri.
    # GitHub Actions cron can run several minutes late during peak load -
    # 06:30 target leaves buffer to land before 07:00.
    - cron: "30 20 * * 0-4"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python screener.py

      - name: Email report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "ASX Strong Buy Screener Report"
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: ASX Screener Bot
          body: "Attached is today's ASX Strong Buy Screener report. This is a research shortlist tool, not financial advice."
          attachments: output/*.xlsx

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: asx-strong-buy-report-${{ github.run_id }}
          path: output/*.xlsx
          retention-days: 90

      - name: Commit report into repo /reports folder
        run: |
          mkdir -p reports
          cp output/*.xlsx reports/
          git config user.name "asx-screener-bot"
          git config user.email "actions@github.com"
          git add reports/*.xlsx
          git diff --cached --quiet || git commit -m "Auto: ASX screener report $(date -u +'%Y-%m-%d')"
          git push
