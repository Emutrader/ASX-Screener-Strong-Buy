yaml

on:
  schedule:
    # 20:30 UTC on Sun-Thu = 06:30 AEST (Brisbane, UTC+10, no daylight saving) Mon-Fri.
    - cron: "30 20 * * 0-4"
  workflow_dispatch: {}

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python screener.py

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: asx-strong-buy-report-${{ github.run_id }}
          path: output/*.xlsx
          retention-days: 90

      - name: Commit report into repo /reports folder
        run: |
          mkdir -p reports
          cp output/*.xlsx reports/
          git config user.name "asx-screener-bot"
          git config user.email "actions@github.com"
          git add reports/*.xlsx
          git diff --cached --quiet || git commit -m "Auto: ASX screener report $(date -u +'%Y-%m-%d')"
          git push












