So the missing step is: actually replace the contents of .github/workflows/asx_screener.yml with the correct version. Uploading screener.py and the other files doesn't touch the workflow file — that needs to be edited separately.

Here's exactly how:

Go to https://github.com/Emutrader/ASX-Screener-Strong-Buy/edit/main/.github/workflows/asx_screener.yml (this takes you straight to the editor for that file)
Select all the existing text and delete it
Paste in this exact content:
yaml
name: ASX Strong Buy Screener

on:
  schedule:
    # 20:30 UTC on Sun-Thu = 06:30 AEST (Brisbane, UTC+10, no daylight saving) Mon-Fri.
    - cron: "30 20 * * 0-4"
  workflow_dispatch: {}

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python screener.py

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: asx-strong-buy-report-${{ github.run_id }}
          path: output/*.xlsx
          retention-days: 90

      - name: Commit report into repo /reports folder
        run: |
          mkdir -p reports
          cp output/*.xlsx reports/
          git config user.name "asx-screener-bot"
          git config user.email "actions@github.com"
          git add reports/*.xlsx
          git diff --cached --quiet || git commit -m "Auto: ASX screener report $(date -u +'%Y-%m-%d')"
          git push












